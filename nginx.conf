# HTTP → HTTPS redirect
server {
    listen 80;
    server_name podrska.vasafirma.com;  # ← promeni na tvoj domen
    return 301 https://$host$request_uri;
}

# HTTPS + WebSocket proxy
server {
    listen 443 ssl;
    server_name podrska.vasafirma.com;  # ← promeni na tvoj domen

    ssl_certificate     /etc/letsencrypt/live/podrska.vasafirma.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/podrska.vasafirma.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Normalni HTTP zahtevi
    location / {
        proxy_pass         http://remote-support:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    # WebSocket – kritično za signaling
    location /ws {
        proxy_pass         http://remote-support:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_read_timeout 3600s;   # 1h – ne prekidaj idle WebSocket
        proxy_send_timeout 3600s;
    }
}
